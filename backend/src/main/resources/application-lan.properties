# Makes the server reachable from phones and laptops on the same network.
# HTTPS is mandatory here: browsers only expose the battery on secure pages.
# start.ps1 creates the certificate and passes its password in the environment.
server.address=0.0.0.0
server.port=8443
server.ssl.key-store=file:./local/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${LIFELINE_KEYSTORE_PASSWORD}
server.ssl.key-alias=lifeline

# Plain HTTP stays available on this machine only (localhost counts as secure).
lifeline.loopback-http-port=8080
