spring.application.name=battery-monitor

# --- Alert rules -------------------------------------------------------------
# An alert is raised when the charge is BELOW this percentage and the device is not charging.
lifeline.alert.low-below=25
# It clears once the device is charging, or climbs ABOVE this percentage.
lifeline.alert.recover-above=30
# A device that has not reported for this long is shown as offline.
lifeline.offline-after=150s
lifeline.offline-check-interval=15s

# --- Dashboard login ---------------------------------------------------------
# Rebuild (start.cmd without -SkipBuild) after changing these.
lifeline.dashboard.username=admin
lifeline.dashboard.password=varun

# --- Device join code --------------------------------------------------------
# Blank: any device that can open the page may join. The public server sets its own code.
lifeline.join-code=

# --- Server: this machine only by default. See application-lan.properties. ----
server.address=127.0.0.1
server.port=8080
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# --- Database: embedded H2 file, kept in backend/data ------------------------
spring.datasource.url=jdbc:h2:file:./data/lifeline
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
