# Used on the public server, behind Caddy (which provides HTTPS). See deploy/.
# The server refuses to start if either secret is missing from /etc/lifeline/lifeline.env.
lifeline.public-server=true
lifeline.dashboard.password=${LIFELINE_DASHBOARD_PASSWORD}
lifeline.join-code=${LIFELINE_JOIN_CODE}

# Trust the visitor's address and "https" as reported by Caddy on this machine.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
